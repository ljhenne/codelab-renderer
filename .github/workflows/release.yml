name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Build Script
        run: |
          chmod +x build-release.sh
          ./build-release.sh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codelab-renderer-darwin-amd64
            dist/codelab-renderer-darwin-arm64
            dist/codelab-renderer-linux-amd64
            dist/codelab-renderer-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
